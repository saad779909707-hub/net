<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="NetControl Mobile — Network & OpenWrt Control PWA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<title>NetControl Mobile</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- Splash -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-logo">◈</div>
  <div class="splash-title">NetControl</div>
  <div class="spinner"></div>
</div>

<header class="topbar glass">
  <button id="btn-lang" class="icon-btn" aria-label="Language">🌐</button>
  <h1 class="topbar-title" data-i18n="appName">NetControl</h1>
  <button id="btn-theme" class="icon-btn" aria-label="Theme">🌙</button>
</header>

<main id="view" class="view" role="main"></main>

<nav class="bottomnav glass" role="navigation" aria-label="Main">
  <button class="nav-btn active" data-route="home" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    <span data-i18n="home">الرئيسية</span>
  </button>
  <button class="nav-btn" data-route="network" aria-label="Network">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2c1.5 0 2.9.4 4.1 1.1L13 9H7.3A8 8 0 0 1 12 4zM4.3 10h6.2l-3 5.2A8 8 0 0 1 4.3 10zM12 20a8 8 0 0 1-3-.6l3-5.2 3 5.2c-.9.4-1.9.6-3 .6zm5.5-4.8L14.5 10h5.2a8 8 0 0 1-2.2 5.2z"/></svg>
    <span data-i18n="network">الشبكة</span>
  </button>
  <button class="nav-btn" data-route="devices" aria-label="Devices">
    <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.7 0-8 1.3-8 4v2h10v-2h6v-2c0-2.7-5.3-4-8-4zm8 0c-.3 0-.7 0-1 .1A4.7 4.7 0 0 1 18 18v2h6v-2c0-2.7-5.3-4-8-4z"/></svg>
    <span data-i18n="devices">الأجهزة</span>
  </button>
  <button class="nav-btn" data-route="openwrt" aria-label="OpenWrt">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zm0 6h16v4H4zm0 6h16v4H4zM7 6h.01M7 12h.01M7 18h.01"/></svg>
    <span>OpenWrt</span>
  </button>
  <button class="nav-btn" data-route="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
    <span data-i18n="settings">الإعدادات</span>
  </button>
</nav>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
